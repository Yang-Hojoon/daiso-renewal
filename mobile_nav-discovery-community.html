        </button>

            <li><a href="#"><img src="img/Failure Stories.png" alt="실패담"></a></li>

        </nav>

    <main>

      <section class="community" aria-label="커뮤니티">
        <img src="img/community img.png">

    <footer class="app-footer">

        <a href="#">로그아웃</a>
      </div>
      <div class="footer-content">
        <div class="footer-section">
          <h3><img src="img/Phone.png" class="footer-icon"> 온라인 다이소몰</h3>
